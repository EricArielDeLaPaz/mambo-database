<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily feed | Mambo Database</title>
<meta name="description" content="A short daily post of what is new in tech and design. Pick your filters and each one adds a section.">
<link rel="stylesheet" href="feed.css">
</head>
<body>
<a class="skip" href="#post">Skip to the feed</a>
<div class="shell">
  <header class="top">
    <h1>Daily feed</h1>
    <p class="lede">What is new in tech and design, one short post per day. Each filter you turn on adds a section.</p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <div class="layout">
    <details id="filters" class="filters">
      <summary id="filters-summary">Filters</summary>
      <div class="filters-body">
        <div class="filters-actions">
          <button type="button" class="btn sm" id="reset">Reset to suggested</button>
          <button type="button" class="btn sm" id="clear">Clear all</button>
        </div>
        <div id="filter-groups"></div>
        <p class="note">Your choices are saved in this browser only.</p>
      </div>
    </details>

    <main id="post" class="main" tabindex="-1">
      <div class="daynav" id="daynav" hidden>
        <label class="dayselect"><span class="vh">Day</span><select id="day"></select></label>
        <button type="button" class="btn sm" id="older" aria-label="Older day">&larr; Older</button>
        <button type="button" class="btn sm" id="newer" aria-label="Newer day">Newer &rarr;</button>
      </div>
      <p id="status" class="vh" role="status" aria-live="polite"></p>
      <div id="out"><p class="msg">Loading the feed&hellip;</p></div>
    </main>
  </div>
</div>
<noscript><p class="msg">This page needs JavaScript to show the feed.</p></noscript>
<script type="module" src="feed.js"></script>
</body>
</html>
