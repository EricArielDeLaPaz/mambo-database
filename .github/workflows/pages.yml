name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 10,11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.js
      - name: Daily feed (the page falls back to sample data if every source fails)
        continue-on-error: true
        run: node scripts/feed.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r dist/site/. _site/
          cp dist/llms.txt _site/llms.txt
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md
          cp -r dist/entries dist/data _site/
          (cd dist/skill && zip -qr ../../_site/create-design-system-skill.zip create-design-system)
          (cd dist/skill && zip -qr ../../_site/design-skill.zip design)
          (cd dist/skill && zip -qr ../../_site/code-skill.zip code)
          (cd dist/skill && zip -qr ../../_site/design-system-audit-skill.zip design-system-audit)
          (cd dist/skill && zip -qr ../../_site/token-sync-skill.zip token-sync)
          (cd dist/skill && zip -qr ../../_site/icon-set-creator-skill.zip icon-set-creator)
          cp -r dist/skill _site/skill
          mkdir -p _site/feed
          cp feed/index.html feed/feed.js feed/feed.css _site/feed/
          cp -r feed/lib feed/data _site/feed/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
