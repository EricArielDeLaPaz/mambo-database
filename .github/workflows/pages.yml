name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r dist/site/. _site/
          cp dist/llms.txt _site/llms.txt
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md
          cp -r dist/entries dist/data _site/
          (cd dist/skill && zip -qr ../../_site/mambo-database-skill.zip mambo-database)
          (cd dist/skill && zip -qr ../../_site/create-design-system-skill.zip create-design-system)
          cp -r dist/skill _site/skill
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
